<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Expense Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head><body>
{% if current_user.is_authenticated %}
<nav class="navbar navbar-expand bg-white shadow-sm px-3">
  <span class="navbar-brand fw-bold">💰 Smart Expense Tracker</span>
  <div class="navbar-nav me-auto">
    <a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a class="nav-link" href="{{ url_for('main.transactions') }}">Transactions</a>
  </div>
  <span class="me-3 text-muted">{{ current_user.name }}</span>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('auth.logout') }}">Logout</a>
</nav>
{% endif %}
<main class="container py-4">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body></html>

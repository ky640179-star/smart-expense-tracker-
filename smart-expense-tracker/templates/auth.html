{% extends "base.html" %}{% block content %}
<div class="card p-4 mx-auto" style="max-width:420px">
<h4 class="mb-3">{{ 'Create account' if mode == 'register' else 'Log in' }}</h4>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if mode == 'register' %}<input class="form-control mb-2" name="name" placeholder="Name" required>{% endif %}
  <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
  <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
  <button class="btn btn-primary w-100">{{ 'Register' if mode == 'register' else 'Login' }}</button>
</form>
<a class="mt-3 small" href="{{ url_for('auth.login' if mode == 'register' else 'auth.register') }}">
  {{ 'Have an account? Log in' if mode == 'register' else 'New here? Register' }}</a>
</div>{% endblock %}
